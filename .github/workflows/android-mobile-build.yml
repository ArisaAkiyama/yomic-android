name: Yomic Mobile Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Run Unit Tests & Build Debug + Release APKs
        run: gradle :app:testGithubDebugUnitTest :app:assembleGithubDebug :app:assembleGithubRelease

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Yomic-Mobile-debug-apk
          path: app/build/outputs/apk/github/debug/app-github-debug.apk

      - name: Upload Lightweight Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Yomic-Mobile-release-apk
          path: app/build/outputs/apk/github/release/app-github-release.apk
