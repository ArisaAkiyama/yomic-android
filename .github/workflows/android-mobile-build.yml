name: Yomic Mobile Android APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Run Unit Tests & Build Release APK
        run: gradle :app:testGithubDebugUnitTest :app:assembleGithubRelease

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Yomic-Mobile-apk
          path: app/build/outputs/apk/github/release/app-github-release.apk

      - name: Prepare Release APK Asset
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          cp app/build/outputs/apk/github/release/app-github-release.apk "Yomic_Mobile_${TAG_NAME}.apk"

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Yomic_Mobile_*.apk
          generate_release_notes: false
